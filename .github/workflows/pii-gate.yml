name: pii-gate

# Fail-closed PII release gate. Runs on every push and PR so no change can
# reintroduce personal data. See CONTRIBUTING.md and engine/scripts/pii_scan.py.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Runs EVERYWHERE (including forks). Protects contributors from committing
  # their own PII / secrets, in the tree AND anywhere in history. No denylist is
  # available in CI (it is gitignored), so this is the structural profile.
  structural:
    name: PII structural gate (tree + history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — the gate scans every reachable blob
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Scan tree + history for structural PII / secrets
        run: python engine/scripts/pii_scan.py --allow-any-identity

  # Canonical repo ONLY, and on `push` events ONLY: require every commit's
  # author/committer to be the template identity. Skipped on forks (contributors
  # legitimately commit under their own name — the structural job carries that
  # load) and skipped on `pull_request` events, whose checked-out ref is a
  # GitHub-generated MERGE commit with its own bot identity that would spuriously
  # fail this check. Every real branch tip is still covered by its `push` event.
  template-identity:
    name: Template-identity gate (canonical repo, push only)
    if: github.event_name == 'push' && github.repository == 'acogood/spain-dnv-consultant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Enforce template commit identity across all history
        run: python engine/scripts/pii_scan.py
